############################################################
# recorder
############################################################

# see https://www.home-assistant.io/integrations/recorder for more!

# db_url: sqlite:///data/home-assistant_v2.db

# deprecated:
# purge_interval: 1

# use the MariaDB add-on...
db_url: !secret MARIADB_DBURL

# automatically purge the database every night at 04:12 local time.
# according to https://www.home-assistant.io/integrations/recorder
auto_purge: true

purge_keep_days: 30

include:
  domains:
    - binary_sensor
    - sensor
    - switch
  entities:
    - sun.sun

exclude:
  domains:
    - updater
    - automation
    - group
    - scene
    - script
    - weblink
  #  - device_tracker
  entities:
    - entity_globs:
        - sensor.l*_scan_results
        - sensor.l*_uptime
        - sensor.l*_uptime_human_readable
        - sensor.zb_*_last_seen
    - sensor.basics_of_sikhi
    - sensor.tyt_investigates
    - sensor.date
    - sensor.date_time
    - sensor.last_boot
    - sensor.time
    - sun.sun
    - zone.home
# ############################################################
#  END OF FILE
# ############################################################
