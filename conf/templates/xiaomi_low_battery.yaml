# template:

# xiaomi low battery alert is based on this sensors
- binary_sensor:
    - default_entity_id: binary_sensor.xiaomi_low_battery_l2_bathroom
      name: Xiaomi low battery L2 bathroom
      state: "{{ states('sensor.temperature_humidity_sensor_e3c3_battery') | int(0) < 11 }}"
      # state: "{{ states('sensor.xiaomi_l2_bathroom_battery') | int(0) < 11 }}"

- binary_sensor:
    - default_entity_id: binary_sensor.xiaomi_low_battery_l2_bedroom
      name: Xiaomi low battery L2 bedroom
      state: "{{ states('sensor.temperature_humidity_sensor_8eec_battery') | int(0) < 11 }}"
      # state: "{{ states('sensor.xiaomi_l2_bedroom_battery') | int(0) < 11 }}"

- binary_sensor:
    - default_entity_id: binary_sensor.xiaomi_low_battery_l2_lounge
      name: Xiaomi low battery L2 lounge
      state: "{{ states('sensor.temperature_humidity_sensor_3592_battery') | int(0) < 11 }}"
      # state: "{{ states('sensor.xiaomi_l2_lounge_battery') | int(0) < 11 }}"

- binary_sensor:
    - default_entity_id: binary_sensor.xiaomi_low_battery_l2_storage
      name: Xiaomi low battery L2 storage
      state: "{{ states('sensor.temperature_humidity_sensor_d59f_battery') | int(0) < 11 }}"
      # state: "{{ states('sensor.xiaomi_l2_storage_battery') | int(0) < 11 }}"
