##########################################################################################
#
# Templated Sensors
#
##########################################################################################

#
# attention: binary_sensor.person_gh_at_home has got an individual state name other than *gh*
#

# template:
- binary_sensor:
    # is the person at home?
    - name: "person_gh_at_home"
      unique_id: "person_gh_at_home"
      state: >
        {{ is_state('binary_sensor.home_gillian_is_here', 'on') }}

    # the charging functionality is enabled, person is at home, charger is on and state is undefined
    - name: "zb_charger_gh_functionality_athome_charger_on_state_undefined"
      unique_id: "zb_charger_gh_functionality_athome_charger_on_state_undefined"
      state: >
        {{ is_state('input_boolean.zb_charger_gh_functionality', 'on') and 
          is_state('binary_sensor.person_gh_at_home', 'on') and 
          (is_state('switch.zb_charger_gh', 'on')) and
          (states('input_select.zb_charger_gh_state_current') ==  states('input_text.zb_charger_state_current_state_is_undefined')) }}

    # the charging functionality is enabled, person is at home and charger is off
    - name: "zb_charger_gh_functionality_athome_charger_off"
      unique_id: "zb_charger_gh_functionality_athome_charger_off"
      state: >
        {{ is_state('input_boolean.zb_charger_gh_functionality', 'on') and 
          is_state('binary_sensor.person_gh_at_home', 'on') and 
          (is_state('switch.zb_charger_gh', 'off')) }}

    # the charging functionality is enabled, and charger is on
    - name: "zb_charger_gh_functionality_charger_on"
      unique_id: "zb_charger_gh_functionality_charger_on"
      state: >
        {{ is_state('input_boolean.zb_charger_gh_functionality', 'on') and 
          (is_state('switch.zb_charger_gh', 'on')) }}

    # the charging functionality is enabled and charger is off
    - name: "zb_charger_gh_functionality_charger_off"
      unique_id: "zb_charger_gh_functionality_charger_off"
      state: >
        {{ is_state('input_boolean.zb_charger_gh_functionality', 'on') and 
          (is_state('switch.zb_charger_gh', 'off')) }}

    # we are in the time frame as set for delayed charging
    - name: "zb_charger_gh_timeframe_in"
      unique_id: "zb_charger_gh_timeframe_in"
      state: >
        {% set time_start = today_at(states('input_datetime.zb_charger_gh_charging_delayed_start_at')) %}
        {% set time_stop = today_at(states('input_datetime.zb_charger_gh_charging_delayed_start_at')) + timedelta(hours = states('input_number.zb_charger_gh_timeframe_length') | int(1), minutes = 0) %}
        {{ (now() >= time_start) and (now() <= time_stop) }}

    # current battery level below charging level
    - name: "zb_charger_gh_cur_batt_lvl_below_charge_level"
      unique_id: "zb_charger_gh_cur_batt_lvl_below_charge_level"
      state: >
        {{ ((states('sensor.batt_lvl_current_gh') | int(0)) < (states('input_number.zb_charger_gh_min_percentage') | int(0))) }}

####################################################################
# EOF
####################################################################
