##########################################################################################
#
# Templated Sensors
#
##########################################################################################

# template:

# we run the normal
- binary_sensor:
    # GH is at home and the charging functionality is enabled while charger is off
    - name: "zb_charger_gh_functionality_athome_charger_off"
      unique_id: "zb_charger_gh_functionality_athome_charger_off"
      state: >
        {{ is_state('input_boolean.zb_charger_gh_functionality', 'on') and 
          is_state('binary_sensor.home_uwe_is_here', 'on') and 
          (is_state('switch.zb_charger_gh', 'off')) }}

    # we are in the time frame as set for GH
    - name: "zb_charger_gh_timeframe_in"
      unique_id: "zb_charger_gh_timeframe_in"
      state: >
        {% set time_start = today_at(states('input_datetime.zb_charger_gh_charging_delayed_start_at')) %}
        {% set time_stop = today_at(states('input_datetime.zb_charger_gh_charging_delayed_start_at')) + timedelta(hours = states('input_number.zb_charger_gh_timeframe_length') | int(1), minutes = 0) %}
        {{ (now() >= time_start) and (now() <= time_stop) }}

    # are we ahead of the delayed start?
    - name: "zb_charger_gh_ahead_of_delayed_charging"
      unique_id: "zb_charger_gh_ahead_of_delayed_charging"
      state: >
        {{ (now() < today_at(states('input_datetime.zb_charger_gh_charging_delayed_start_at'))) }}

    # current battery level below emergency charging level
    - name: "zb_charger_gh_cur_batt_lvl_below_emergency_chrg_level"
      unique_id: "zb_charger_gh_cur_batt_lvl_below_emergency_chrg_level"
      state: >
        {{ (states('sensor.batt_lvl_current_gh') | int(0) <= (states('input_number.zb_charger_gh_min_percentage_emergency') | int(0))) }}

    # current battery level below delayed charging level
    - name: "zb_charger_gh_cur_batt_lvl_below_max_delayed_chrg_level"
      unique_id: "zb_charger_gh_cur_batt_lvl_below_max_delayed_chrg_level"
      state: >
        {{ ((states('sensor.batt_lvl_current_gh') | int(0)) < (states('input_number.zb_charger_gh_max_percentage_delayed') | int(0))) }}

    # current battery level below low charging level
    - name: "zb_charger_gh_cur_batt_lvl_below_low_chrg_level"
      unique_id: "zb_charger_gh_cur_batt_lvl_below_low_chrg_level"
      state: >
        {{ ((states('sensor.batt_lvl_current_gh') | int(0)) <= (states('input_number.zb_charger_gh_min_percentage_low_percentage') | int(0))) }}

    # current state is not "emergency charging finished"
    - name: "zb_charger_gh_current_state_is_not_emergency_charging_finished"
      unique_id: "zb_charger_gh_current_state_is_not_emergency_charging_finished"
      state: >
        {{ (states('input_select.zb_charger_gh_state_current') !=  states('input_text.zb_charger_state_current_emergency_charging_finished')) }}

    # current state is not "delayed charging finished"
    - name: "zb_charger_gh_current_state_is_not_delayed_charging_finished"
      unique_id: "zb_charger_gh_current_state_is_not_delayed_charging_finished"
      state: >
        {{ (states('input_select.zb_charger_gh_state_current') !=  states('input_text.zb_charger_state_current_delayed_charging_finished')) }}

####################################################################
# EOF
####################################################################
