##########################################################################################
#
# Templated Sensors
#
##########################################################################################

# template:
- binary_sensor:
    - name: "zb_charger_uh_low_percentage_off_trigger"
      unique_id: "zb_charger_uh_low_percentage_off_trigger"
      state: >
        {{ (is_state('binary_sensor.zb_charger_uh_functionality_charger_on', 'on')) and 
           (is_state('input_boolean.zb_charger_uh_current_state_is_ordinary_charging_in_progress', 'on')) and 
           ((states('sensor.batt_lvl_current_uh') | int(0)) >= (states('input_number.zb_charger_uh_max_percentage') | int(0))) }}

    - name: "zb_charger_uh_delayed_charging_off_trigger"
      unique_id: "zb_charger_uh_delayed_charging_off_trigger"
      state: >
        {{ (is_state('binary_sensor.zb_charger_uh_functionality_charger_on', 'on')) and 
           (is_state('input_boolean.zb_charger_uh_current_state_is_delayed_charging_in_progress', 'on')) and 
           (states('sensor.batt_lvl_current_uh') | int(0)) >= (states('input_number.zb_charger_uh_max_percentage') | int(0)) }}

####################################################################
# EOF
####################################################################
