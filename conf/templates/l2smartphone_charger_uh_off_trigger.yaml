- binary_sensor:
    - name: "zb_charger_uh_off_trigger"
      unique_id: "zb_charger_uh_off_trigger"
      state: >
        {{ (is_state('binary_sensor.zb_charger_uh_functionality_charger_on', 'on')) and 
           ((states('sensor.batt_lvl_current_uh') | int(0)) >= (states('input_number.zb_charger_uh_max_percentage') | int(0))) }}

