##########################################################################################
#
# Templated Sensors
#
##########################################################################################

# template:

# who is at home?
- binary_sensor:
    # binary_sensor.at_home_uwe_yn
    - name: "Home: Uwe is here"
      unique_id: "at_home_uwe_yn"
      state: >
        {{ is_state('person.uwe', 'home') }}

    # binary_sensor.at_home_gillian_yn
    - name: "Home: Gillian is here"
      unique_id: "at_home_gillian_yn"
      state: >
        {{ is_state('person.gillian', 'home') }}

    # binary_sensor.at_home_someone_yn
    - name: "Home: someone is here"
      unique_id: "at_home_someone_yn"
      state: >
        {{
          (is_state('person.uwe', 'home')) or
          (is_state('person.gillian', 'home')) or
          (is_state('binary_sensor.at_home_someone_presence_yn', 'on'))
        }}

    # binary_sensor.at_home_all_yn
    - name: "Home: all are here"
      unique_id: "at_home_all_yn"
      state: >
        {{
          (
            (is_state('person.uwe', 'home')) and
            (is_state('person.gillian', 'home'))
          ) or
          (is_state('binary_sensor.at_home_someone_presence_yn', 'on'))
        }}

    # binary_sensor.at_home_all_are_gone
    - name: "Home: all are gone"
      unique_id: "at_home_all_are_gone"
      state: >
        {{
          (
            (not is_state('person.uwe', 'home')) and
            (not is_state('person.gillian', 'home'))
          ) or
          (is_state('binary_sensor.at_home_someone_presence_yn', 'off'))
        }}

    # binary_sensor.at_home_someone_presence_yn
    - name: "Home: someone is here with presence"
      unique_id: "at_home_someone_presence_yn"
      state: >
        {{ (is_state('group.zb_l2_presence', 'on')) }}

####################################################################
# EOF
####################################################################
