##########################################################################################
#
# Templated Sensors
#
##########################################################################################

# template:

# who is at home?
- binary_sensor:
    # binary_sensor.home_uwe_is_here
    - name: "Home: Uwe is here"
      unique_id: "home_uwe_is_here"
      state: >
        {{ is_state('person.uwe', 'home') }}

    # binary_sensor.home_gillian_is_here
    - name: "Home: Gillian is here"
      unique_id: "home_gillian_is_here"
      state: >
        {{ is_state('person.gillian', 'home') }}

    # binary_sensor.home_someone_is_here
    - name: "Home: someone is here"
      unique_id: "home_someone_is_here"
      state: >
        {{
          (is_state('person.uwe', 'home')) or
          (is_state('person.gillian', 'home')) or
          (is_state('binary_sensor.home_someone_is_here_with_presence_only', 'on'))
        }}

    # binary_sensor.home_all_are_here
    - name: "Home: all are here"
      unique_id: "home_all_are_here"
      state: >
        {{
          (
            (is_state('person.uwe', 'home')) and
            (is_state('person.gillian', 'home'))
          ) or
          (is_state('binary_sensor.home_someone_is_here_with_presence_only', 'on'))
        }}

    # binary_sensor.home_all_are_gone
    - name: "Home: all are gone"
      unique_id: "home_all_are_gone"
      state: >
        {{
          (
            (not is_state('person.uwe', 'home')) and
            (not is_state('person.gillian', 'home'))
          ) or
          (is_state('binary_sensor.home_someone_is_here_with_presence_only', 'off'))
        }}

    # binary_sensor.home_someone_is_here_with_presence_only
    - name: "Home: someone is here with presence only"
      unique_id: "home_someone_is_here_with_presence_only"
      state: >
        {{ (is_state('group.zb_l2_presence', 'on')) }}

####################################################################
# EOF
####################################################################
