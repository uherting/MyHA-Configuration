##########################################################################################
#
# Templated Sensors
#
##########################################################################################

# template:
- binary_sensor:
    # trigger for delayed charging
    - name: "zb_charger_gh_delayed_charging_on_trigger"
      unique_id: "zb_charger_gh_delayed_charging_on_trigger"
      state: >
        {{ (is_state('binary_sensor.zb_charger_gh_functionality_athome', 'on')) and 
           (is_state('input_boolean.zb_charger_gh_force_delayed', 'on')) and 
           (is_state('binary_sensor.zb_charger_gh_timeframe_in', 'on'))
        }}

    # trigger for low percentage charging
    - name: "zb_charger_gh_low_percentage_on_trigger"
      unique_id: "zb_charger_gh_low_percentage_on_trigger"
      state: >
        {{ (is_state('binary_sensor.zb_charger_gh_functionality_athome_charger_off', 'on')) and 
           (is_state('binary_sensor.zb_charger_gh_cur_batt_lvl_below_charge_level', 'on'))
        }}

####################################################################
# EOF
