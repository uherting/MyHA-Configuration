icon: mdi:cctv
title: CCTV H431 ESP32
path: cctv-esp32cams
badges: []

cards:
  - type: picture-glance
    title: ESP32Cam 01
    camera_image: camera.l9cam3201_cam
    camera_view: live
    tap_action: none
    entities:
      - binary_sensor.l9cam3201_status
      - sensor.l9cam3201_esphome_version
      - switch.level_9_l9cam3201_camlight
      - switch.l9cam3201_restart_device

