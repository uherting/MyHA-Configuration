####################################################################

icon: mdi:cctv
title: CCTV H431 general
path: cctv-general
badges: []

cards:
  - type: picture-glance
    title: RWorld3
    camera_image: camera.rworld3_fluent
    camera_view: live
    tap_action: none
    entities:
      - binary_sensor.cam_rworld1_motion

  - type: picture-glance
    title: RWorld1 Big Pic
    camera_image: camera.rworld1_fluent_lens_0
    camera_view: live
    tap_action: none
    entities:
      - binary_sensor.cam_rworld1_motion

  - type: picture-glance
    title: RWorld1 Detail Pic
    camera_image: camera.rworld1_fluent_lens_1
    camera_view: live
    tap_action: none
    entities:
      - binary_sensor.cam_rworld1_motion

  - type: picture-glance
    title: ESP32Cam 03
    camera_image: camera.l9cam3203_cam
    camera_view: live
    # tap_action: none
    entities:
      - binary_sensor.l9cam3203_status
      - sensor.l9cam3203_esphome_version
      - switch.level_9_l9cam3203_camlight
      - switch.l9cam3203_restart_device

  - type: picture-glance
    title: ESP32Cam 04
    camera_image: camera.l9cam3204_cam
    camera_view: live
    tap_action: none
    entities:
      - binary_sensor.l9cam3204_status
      - sensor.l9cam3204_esphome_version
      - switch.level_9_l9cam3204_camlight
      - switch.l9cam3204_restart_device

  - type: picture-glance
    title: ESP32Cam 05
    camera_image: camera.l9cam3205_cam
    camera_view: live
    tap_action: none
    entities:
      - binary_sensor.l9cam3205_status
      - sensor.l9cam3205_esphome_version
      - switch.level_9_l9cam3205_camlight
      - switch.l9cam3205_restart_device
