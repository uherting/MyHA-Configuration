# input_number:

# charge up to x% (normal charging)
zb_charger_gh_max_percentage:
  name: Charging max
  min: 80
  max: 99
  step: 1
  unit_of_measurement: "%"
  mode: slider
  icon: mdi:percent

# the length of the time frame starting with the time when delayed charging starts
zb_charger_gh_timeframe_length:
  name: Length of timeframe in hours
  min: 1
  max: 5
  step: 1
  unit_of_measurement: "h"
  mode: slider
  icon: mdi:timer-sand
