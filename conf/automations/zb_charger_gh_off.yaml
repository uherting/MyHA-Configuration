# ############################################################
#  Turn the ZB plug off GH
# ############################################################
- alias: Turn the ZB plug GH off
  id: "2e1c885c-ce12-4e7a-9b36-8aed1d8f7a70"
  description: "This automation turns off the ZB plug GH"
  mode: single
  initial_state: true
  # --------------------- TRIGGER ---------------------
  triggers:
    - trigger: template
      value_template: "{{ (is_state('binary_sensor.zb_charger_gh_off_trigger', 'on')) }}"
  # -------------------- CONDITIONS -------------------
  # none whatsoever
  condition: []
  # --------------------- ACTIONS ---------------------
  action:
    - sequence:
        - action: switch.turn_off
          entity_id: switch.zb_charger_gh
        - action: input_select.select_option
          target:
            entity_id: input_select.zb_charger_gh_state_current
          data:
            option: "{{ states('input_text.zb_charger_state_current_charging_finished') }}"
############################################################
#  END OF FILE
# ############################################################
