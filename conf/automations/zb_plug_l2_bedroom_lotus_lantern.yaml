# ############################################################
#
#  Switch Lotus Lantern switch in L2 Bedroom
#
# ############################################################

# ############################################################
# Lotus Lanter L2 Bedroom off
# ############################################################
- alias: Lotus Lanter L2 Bedroom off
  id: "019cee00-0328-746b-a271-badb26375bc4"
  mode: single
  initial_state: true

  # --------------------- TRIGGER ---------------------
  triggers:
    - trigger: time
      at: "02:58:00"

  # -------------------- CONDITIONS -------------------
  condition: []

  # --------------------- ACTIONS ---------------------
  action:
    # ------------------- zb_plug_l2_bedroom_lotus_lantern off -------------------
    - action: switch.turn_off
      target:
        entity_id: switch.zb_plug_l2_bedroom_lotus_lantern

# ############################################################
# Lotus Lanter L2 Bedroom charging lightbars
# ############################################################
- alias: Lotus Lanter L2 Bedroom charging lightbars
  id: "01a0ab02-2733-7412-8b32-50810ab12ab2"
  mode: single
  initial_state: true

  # --------------------- TRIGGER ---------------------
  triggers:
    - trigger: time
      at: "19:00:00"

  # -------------------- CONDITIONS -------------------
  condition: []

  # --------------------- ACTIONS ---------------------
  action:
    # ------------------- zb_plug_l2_bedroom_lotus_lantern off -------------------
    - action: switch.turn_on
      target:
        entity_id: switch.zb_plug_l2_bedroom_lotus_lantern
    - delay: 00:10
    - action: switch.turn_off
      target:
        entity_id: switch.zb_plug_l2_bedroom_lotus_lantern
# ############################################################
#  END OF FILE
# ############################################################
