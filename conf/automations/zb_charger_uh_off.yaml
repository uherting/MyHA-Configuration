# ############################################################
#  Turn the ZB plug off UH
# ############################################################
- alias: Turn the ZB plug UH off
  id: "5334d948-e9d6-4f8f-8303-9720fd2f1ef4"
  description: "This automation turns off the ZB plug UH"
  mode: single
  initial_state: true
  # --------------------- TRIGGER ---------------------
  triggers:
    - trigger: template
      value_template: "{{ (is_state('binary_sensor.zb_charger_uh_off_trigger', 'on')) }}"
  # -------------------- CONDITIONS -------------------
  # none whatsoever
  condition: []
  # --------------------- ACTIONS ---------------------
  action:
    - sequence:
        - action: switch.turn_off
          entity_id: switch.zb_charger_uh
        - action: input_select.select_option
          target:
            entity_id: input_select.zb_charger_uh_state_current
          data:
            option: "{{ states('input_text.zb_charger_state_current_charging_finished') }}"
############################################################
#  END OF FILE
# ############################################################
