# ############################################################
#
#  Open window detected
#
# ############################################################

# ############################################################
#  Open window detected in the bedroom
# ############################################################
- alias: Open window detected in the bedroom
  id: "48ba3366-08e4-4885-bd8a-94b090585307"
  description: "This automation handles L2 TRV open window conditions"
  mode: single
  max_exceeded: silent

  initial_state: true
  # --------------------- TRIGGER ---------------------
  triggers:
    # if the group ZB_DW_L2_bedroom_contacts goes to "on"
    - trigger: state
      id: "ZB_DW_L2_bedroom_contacts"
      entity_id: group.zb_dw_l2_bedroom_contacts
      to: "on"
  # -------------------- CONDITIONS -------------------
  condition:
    - alias: "Allowing the switching of trv hvac mode based on enable switch"
      condition: state
      entity_id: input_boolean.trv_enable_hvac_mode_switching
      state: "on"
  # --------------------- ACTIONS ---------------------
  actions:
    # ------------- TRV GETS SWITCHED OFF ----------
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.zb_trv_bedroom_l2
      data:
        hvac_mode: "off"

# ############################################################
#  Closed window detected after it was open (bedroom)
# ############################################################
- alias: Closed window detected in the bedroom
  id: "01a1e006-52e2-734d-b394-372e4f11d46d"
  description: "This automation handles L2 TRV post open window conditions"
  mode: single
  max_exceeded: silent

  initial_state: true
  # --------------------- TRIGGER ---------------------
  triggers:
    # if the group ZB_DW_L2_bedroom_contacts goes to "off"
    - trigger: state
      id: "ZB_DW_L2_bedroom_contacts"
      entity_id: group.zb_dw_l2_bedroom_contacts
      to: "off"
  # -------------------- CONDITIONS -------------------
  condition:
    - alias: "Allowing the switching of trv hvac mode based on enable switch"
      condition: state
      entity_id: input_boolean.trv_enable_hvac_mode_switching
      state: "on"
  # --------------------- ACTIONS ---------------------
  actions:
    # ------------- TRV GETS SWITCHED BACK TO AUTO ----------
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.zb_trv_bedroom_l2
      data:
        hvac_mode: "auto"
# ############################################################
#  END OF FILE
# ############################################################
