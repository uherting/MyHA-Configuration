# ############################################################
#  Turn the ZB plug on UH
# ############################################################
- alias: Turn the ZB plug UH on
  id: "ff716105-8398-4292-ad51-d69de18ac007"
  description: "This automation turns on the ZB plug UH"
  mode: single
  initial_state: true
  # --------------------- TRIGGER ---------------------
  triggers:
    - trigger: template
      id: "delayed_charging_on"
      value_template: "{{ (is_state('binary_sensor.zb_charger_uh_delayed_charging_on_trigger', 'on')) }}"
    - trigger: template
      id: "low_percentage_on"
      value_template: "{{ (is_state('binary_sensor.zb_charger_uh_low_percentage_on_trigger', 'on')) }}"
  # -------------------- CONDITIONS -------------------
  # none whatsoever
  condition: []
  # --------------------- ACTIONS ---------------------
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: "delayed_charging_on"
          sequence:
            - action: switch.turn_on
              entity_id: switch.zb_charger_uh
            - action: input_select.select_option
              target:
                entity_id: input_select.zb_charger_uh_state_current
              data:
                option: "{{ states('input_text.zb_charger_state_current_delayed_charging_in_progress') }}"
        - conditions:
            - condition: trigger
              id: "low_percentage_on"
          sequence:
            - action: switch.turn_on
              entity_id: switch.zb_charger_uh
            - action: input_select.select_option
              target:
                entity_id: input_select.zb_charger_uh_state_current
              data:
                option: "{{ states('input_text.zb_charger_state_current_normal_charging_in_progress') }}"
      default:
        - action: system_log.write
          data:
            message: "ZB plug UH on default action which is not defined @ {{ (now().timestamp()) | timestamp_custom('%Y%m%d%H%M%S') }}"
            level: "error"
            logger: "system_log.external"
# ############################################################
#  END OF FILE
# ############################################################
