# ############################################################
#  Open window detected in the kitchen
# ############################################################
- alias: Open window detected in the kitchen
  id: "01a17ee3-dd07-70cd-8ebd-1bda0b0f7f27"
  description: "This automation handles L2 TRV open window conditions"
  mode: single
  max_exceeded: silent

  initial_state: true
  # --------------------- TRIGGER ---------------------
  triggers:
    # if the group ZB_DW_L2_kitchen_contacts goes to "on"
    - trigger: state
      id: "ZB_DW_L2_kitchen_contacts"
      entity_id: binary_sensor.ZB_DW_L2_kitchen_contacts
      to: "on"
  # -------------------- CONDITIONS -------------------
  condition:
    - alias: "Allowing the switching of trv hvac mode based on enable switch"
      condition: state
      entity_id: input_boolean.trv_enable_hvac_mode_switching
      state: "on"
  # --------------------- ACTIONS ---------------------
  actions:
    # ------------- TRV GETS SWITCHED OFF / BACK TO AUTO ----------
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.zb_trv_kitchen_l2
      data:
        hvac_mode: "off"
    # 20 minutes delay till return to auto mode
    - delay: "00:20"
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.zb_trv_kitchen_l2
      data:
        hvac_mode: "auto"
# ############################################################
#  END OF FILE
# ############################################################
