# Add more dashboards
# attn: the name of the dashboard needs to contain a hyphen (-)
dashboards:
  # lovelace:
  uilovelace-usr-ovw-all1:
    mode: yaml
    filename: ui-lovelace-usr_ovw_all1.yaml
    title: Batteries
    icon: mdi:battery
    show_in_sidebar: true
    require_admin: false

  uilovelace-adm-ovw-all1:
    mode: yaml
    filename: ui-lovelace-adm_ovw_all1.yaml
    title: Admin - general
    icon: mdi:tools
    show_in_sidebar: true
    require_admin: true

  uilovelace-adm-ovw-esp1:
    mode: yaml
    filename: ui-lovelace-adm_ovw_esp1.yaml
    title: Admin - ESP
    icon: mdi:devices
    show_in_sidebar: true
    require_admin: true

  ui-lovelace-main:
    mode: yaml
    filename: ui-lovelace_main.yaml
    title: Home overview
    icon: mdi:home
    show_in_sidebar: true
    require_admin: false
