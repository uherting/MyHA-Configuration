####################################################################
# DESCRIPTION
####################################################################
#
# Purpose:
#   - This microcontroller takes care of the relay in the L2 bathroom
#     by cutting off the power supply to the relay controlling the 
#     water flow to the water with the help of a relay board.
#
#     Short term solution: 
#       - After pushing one of the white buttons of the toiket, the 
#         water runs for a short time.
#       - A touch button to  give the water relay power for additional 
#         x seconds in order to add more water to the container. 
#     Long term solution: 
#       - After pushing one of the white buttons of the toiket, the 
#         water runs until a sensor detects the appropriate water 
#         height in the container.
#
# Hardware:
#   - 1 Wemos D1 mini
#   - 1 relay module
#   - 1 touch button
#   - 2 reed switches
#   - 1 capacitive water level sensor (not yet installed)
#
# Automation:
#   - undetermined
#
# WiFi:
#   - connects to the strongest WiFi configured
#
# Input:
#   - TB (for the short term solution only)
#
# Output
#   - 1 relay module
#

